name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalacija zavisnosti
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      # Runner radi u UTC-u, razvojni racunar u Europe/Belgrade. Greska koja
      # pretpostavi lokalnu zonu prolazi na jednom, pada na drugom — zato se
      # testovi vrte jos jednom u trecoj zoni.
      - name: Vitest u drugoj vremenskoj zoni
        run: npm run test
        env:
          TZ: America/New_York
